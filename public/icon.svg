<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="frontSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="backSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#1e293b" stroke-width="8"/>

  <!-- Back Sheet (Source) -->
  <g filter="url(#glow)">
    <rect x="250" y="210" width="380" height="480" rx="44" fill="url(#backSheet)" opacity="0.6"/>
    <!-- Folded corner -->
    <path d="M 530 210 L 630 310 L 530 310 Z" fill="#1e1b4b" opacity="0.5"/>
  </g>

  <!-- Front Sheet (Target Destination) -->
  <g filter="url(#glow)">
    <rect x="390" y="330" width="380" height="480" rx="44" fill="url(#frontSheet)"/>
    <path d="M 670 330 L 770 430 L 670 430 Z" fill="#0369a1" opacity="0.4"/>
    
    <!-- Checkmark badge on front sheet for verified copy -->
    <circle cx="580" cy="580" r="76" fill="#090d16" opacity="0.85"/>
    <path d="M 540 580 L 568 608 L 626 550" fill="none" stroke="#00f2fe" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fast Transfer Speed Lines / Motion Arrows -->
  <path d="M 220 540 L 320 540" fill="none" stroke="#00f2fe" stroke-width="24" stroke-linecap="round" opacity="0.8"/>
  <path d="M 180 610 L 320 610" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
  <path d="M 240 680 L 320 680" fill="none" stroke="#818cf8" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
</svg>
